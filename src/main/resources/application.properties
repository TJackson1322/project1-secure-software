spring.application.name=secure-database
spring.datasource.url=jdbc:h2:mem:securedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.security.user.name=${APP_USERNAME:admin}
spring.security.user.password=${APP_PASSWORD:change-this-password}
spring.security.user.roles=ADMIN
# HTTPS is configured after creating a local keystore; see README.md.
